services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: ari-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.raw --partitions 8 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.clean --partitions 8 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.enriched --partitions 8 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.dlq --partitions 4 --replication-factor 1

  mongodb:
    image: mongo:8.0
    container_name: ari-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    container_name: ari-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ARI_MONGODB_URI: mongodb://mongodb:27017
      ARI_MONGODB_DATABASE: amazon_reviews
      ARI_MODEL_PATH: /opt/app/models/sentiment_baseline.joblib
      ARI_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./models:/opt/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: ari-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

  metadata-enricher:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    profiles: ["metadata"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ARI_MONGODB_URI: mongodb://mongodb:27017
      ARI_MONGODB_DATABASE: amazon_reviews
    command:
      - python
      - -m
      - amazon_review_intelligence.data.enrich_metadata
      - --categories
      - All_Beauty
      - Appliances

  spark-streaming:
    build:
      context: .
      dockerfile: infrastructure/spark.Dockerfile
    container_name: ari-spark-streaming
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      ARI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARI_MONGODB_URI: mongodb://mongodb:27017
      ARI_MONGODB_DATABASE: amazon_reviews
      ARI_MODEL_PATH: /opt/app/models/sentiment_baseline.joblib
      ARI_MAX_OFFSETS_PER_TRIGGER: 20000
      ARI_CHECKPOINT_ROOT: /opt/app/checkpoints/topic-generation-3
      ARI_MONGODB_MAX_RETRIES: 30
      ARI_MONGODB_RETRY_DELAY_SECONDS: 2
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - /opt/app/src/amazon_review_intelligence/streaming/spark_job.py
    volumes:
      - ./models:/opt/app/models:ro
      - ./data/checkpoints:/opt/app/checkpoints

  producer:
    build:
      context: .
      dockerfile: infrastructure/producer.Dockerfile
    profiles: ["ingest"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      ARI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARI_RAW_TOPIC: amazon.reviews.raw
    command: ["--input", "/opt/app/data/clean/reviews_*.jsonl", "--limit", "1000000", "--rate", "5000"]
    volumes:
      - ./data:/opt/app/data:ro

  recommender:
    build:
      context: .
      dockerfile: infrastructure/spark.Dockerfile
    profiles: ["recommendation"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ARI_MONGODB_URI: mongodb://mongodb:27017
      ARI_MONGODB_DATABASE: amazon_reviews
      ARI_RECOMMENDATION_INPUT: /opt/app/data/clean/reviews_*.jsonl
      ARI_RECOMMENDATION_TOP_K: 10
      ARI_RECOMMENDATION_CANDIDATES: 20
      ARI_RECOMMENDATION_MIN_USER_INTERACTIONS: 2
      ARI_RECOMMENDATION_MODEL_VERSION: hybrid-als-nlp-v1
      ARI_ALS_RANK: 8
      ARI_ALS_MAX_ITER: 5
      ARI_ALS_REG_PARAM: 0.1
      ARI_SPARK_SHUFFLE_PARTITIONS: 32
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 2g
      - /opt/app/src/amazon_review_intelligence/recommendation/spark_recommender.py
    volumes:
      - ./data/clean:/opt/app/data/clean:ro

volumes:
  kafka-data:
  mongo-data:

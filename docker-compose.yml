services:
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    container_name: ari-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9092'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.raw --partitions 8 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.clean --partitions 8 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.enriched --partitions 8 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic amazon.reviews.dlq --partitions 4 --replication-factor 1

  mongodb:
    image: mongo:8.0
    container_name: ari-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    volumes:
      - mongo-data:/data/db

  spark-streaming:
    build:
      context: .
      dockerfile: infrastructure/spark.Dockerfile
    container_name: ari-spark-streaming
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      ARI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARI_MONGODB_URI: mongodb://mongodb:27017
      ARI_MONGODB_DATABASE: amazon_reviews
      ARI_MODEL_PATH: /opt/app/models/sentiment_baseline.joblib
      ARI_MAX_OFFSETS_PER_TRIGGER: 20000
      ARI_CHECKPOINT_ROOT: /opt/app/checkpoints/topic-generation-2
      ARI_MONGODB_MAX_RETRIES: 30
      ARI_MONGODB_RETRY_DELAY_SECONDS: 2
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0
      - /opt/app/src/amazon_review_intelligence/streaming/spark_job.py
    volumes:
      - ./models:/opt/app/models:ro
      - ./data/checkpoints:/opt/app/checkpoints

  producer:
    build:
      context: .
      dockerfile: infrastructure/producer.Dockerfile
    profiles: ["ingest"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      ARI_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARI_RAW_TOPIC: amazon.reviews.raw
    command: ["--input", "/opt/app/data/clean/reviews_*.jsonl", "--limit", "1000000", "--rate", "5000"]
    volumes:
      - ./data:/opt/app/data:ro

volumes:
  kafka-data:
  mongo-data:

